# Builds a standalone Windows installer (no Python needed for players)
# and attaches it to the GitHub Release when you push a tag like v0.9-beta.
name: Build installer .exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install UnityPy pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --console
          --name DressmakerUA-Installer
          --paths tools
          --collect-all UnityPy
          --add-data "translation;translation"
          tools/install.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DressmakerUA-Installer
          path: dist/DressmakerUA-Installer.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DressmakerUA-Installer.exe
          prerelease: ${{ contains(github.ref_name, 'beta') }}
