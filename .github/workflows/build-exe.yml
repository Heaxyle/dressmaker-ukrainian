# Builds a standalone Windows installer (no Python needed for players)
# and publishes it as a GitHub Release.
# Trigger: push a tag like v0.9.1-beta  (git tag v0.9.1-beta && git push origin v0.9.1-beta)
#          or run it manually from the Actions tab (builds the exe only, no release).
name: Build installer .exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install UnityPy TypeTreeGeneratorAPI pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --console
          --name DressmakerUA-Installer
          --paths tools
          --collect-all UnityPy
          --collect-all TypeTreeGeneratorAPI
          --add-data "translation;translation"
          tools/install.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DressmakerUA-Installer
          path: dist/DressmakerUA-Installer.exe

      - name: Create release and attach exe
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ format('{0} — Ukrainian translation', github.ref_name) }}
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          body: |
            Українізатор Dressmaker / Ukrainian translation for Dressmaker (unofficial fan translation).

            Download **DressmakerUA-Installer.exe**, run it, press 1 to install. Run it again to reinstall or uninstall.
            What's new: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          files: dist/DressmakerUA-Installer.exe
